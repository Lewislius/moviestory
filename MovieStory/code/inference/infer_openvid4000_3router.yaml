name: moviestory-openvid4000-3router-inference
description: strict MQ-only inference with trained three-router and Wan condition weights
workspace: ALL-IN-ONE
project: wan-animate

max_restarts: 0
resources:
  resource_pool: amp-48g
  slots_per_trial: 2
  is_single_node: true
  shm_size: 34359738368

bind_mounts:
  - host_path: /mount/HOME/liuzhirui
    container_path: /home/liuzhirui
  - host_path: /mount/NAS1/public
    container_path: /run/determined/NAS1/public

environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
    - HOME=/home/liuzhirui
    - PYTHONUNBUFFERED=1
    - TOKENIZERS_PARALLELISM=false
    - ENCODER_DEVICE=0
    - DIT_DEVICE=1
    - RUNTIME_AUDIT=full
    - GUIDE_SCALE=1.0
    - CFG_UNCOND_MODE=empty_mq
    - FIRST_FRAME_MODE=preserved
    - AUDIT_GROWTH_LIMIT=20.0
    - MAX_NOISE_HIGH_FREQUENCY_RATIO=0.9
    - MIN_REFERENCE_FRAME_CORRELATION=0.5
    - MAX_REFERENCE_FRAME_MAE=0.4
    - OFFLOAD_MODEL=1
    - T5_CPU=1

checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/MovieStory/code/checkpoint
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0

searcher:
  name: single
  metric: validation_loss
  max_length:
    epochs: 1
  smaller_is_better: true

profiling:
  enabled: true

entrypoint: /home/liuzhirui/Project/MovieStory/code/infer_openvid4000_3router.sh
