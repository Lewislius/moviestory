name: moviestory-openvid4000-3router
description: train the MovieStory three-router planner on the first 4000 OpenVid videos
workspace: ALL-IN-ONE
project: wan-animate

max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 2
  is_single_node: true
  shm_size: 34359738368

bind_mounts:
  - host_path: /mount/HOME/liuzhirui
    container_path: /home/liuzhirui
  - host_path: /mount/NAS1/public
    container_path: /run/determined/NAS1/public

environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
    - HOME=/home/liuzhirui
    - WANDB_ENABLED=1
    - WANDB_PROJECT=moviestory-3router
    - WANDB_LOG_EVERY_STEP=1

checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/MovieStory/code/checkpoint
  save_experiment_best: 0
  save_trial_best: 1
  save_trial_latest: 1

searcher:
  name: single
  metric: validation_loss
  max_length:
    epochs: 1
  smaller_is_better: true

profiling:
  enabled: true

entrypoint: /home/liuzhirui/Project/MovieStory/code/train_openvid4000_3router.sh
