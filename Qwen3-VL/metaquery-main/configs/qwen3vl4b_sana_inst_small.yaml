# Qwen3-VL-4B + Sana 1.6B (MetaQuery Instruction Tuning, Stage 2) — 小数据量版（1/100）
# MetaQuery-Instruct-2.4M 原始约 240 万条，0.024 表示使用 0.024 × 1,000,000 = 2.4 万条（约 1/100）
_gradient_checkpointing: True
vae_id: "Efficient-Large-Model/Sana_1600M_512px_diffusers"
noise_scheduler_id: "Efficient-Large-Model/Sana_1600M_512px_diffusers"
scheduler_id: "Efficient-Large-Model/Sana_1600M_512px_diffusers"
mllm_id: "Qwen/Qwen3-VL-4B-Instruct"
diffusion_model_id: "Efficient-Large-Model/Sana_1600M_512px_diffusers"
vae_downsample_f: 32
in_channels: 32
target_image_size: 512
per_device_train_batch_size: 8
learning_rate: 0.00005
eval_steps: 100
save_steps: 100
warmup_steps: 200
num_train_epochs: 10.0
lr_scheduler_type: "cosine_with_min_lr"
lr_scheduler_kwargs:
  min_lr: 0.000001
loss_type: "flow"
num_metaqueries: 256
modules_to_freeze:
  - "vae"
  - "model.mllm_backbone"

modules_to_unfreeze:
  - "model.mllm_backbone.model.embed_tokens"

connector_num_hidden_layers: 24
deepspeed: "/home/liuzhirui/model/Qwen3-VL-main/metaquery-main/configs/zero1.json"

train_datasets:
  inst2m: 0.0024

eval_dataset: "inst2m"
