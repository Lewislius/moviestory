name: convert-wan-fsdp-flat-to-portable
description: Convert the flat FSDP checkpoint of Wan training to a portable format for inference.
workspace: ALL-IN-ONE
project: wan-animate

max_restarts: 0
resources:
  resource_pool: amp-48g
  slots_per_trial: 2
  is_single_node: true
  shm_size: 34359738368

bind_mounts:
  - host_path: /mount/HOME/liuzhirui
    container_path: /home/liuzhirui
  - host_path: /mount/NAS1/public
    container_path: /run/determined/NAS1/public

environment:
  image: 10.130.130.5:8192/liuzhirui:ubuntu22-04-cuda12.8-v3

checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui/model
  storage_path: checkpoint
  save_experiment_best: 0
  save_trial_best: 1
  save_trial_latest: 1

searcher:
  name: single
  metric: validation_loss
  max_length:
    epochs: 1
  smaller_is_better: true

profiling:
  enabled: true

entrypoint: /home/liuzhirui/model/Wan2.2/convert_wan_fsdp_flat_to_portable.sh

