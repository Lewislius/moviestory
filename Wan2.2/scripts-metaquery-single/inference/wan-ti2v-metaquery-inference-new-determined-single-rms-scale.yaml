name: 10min-metaquery-overfit-demo-diff-img-rms
description: a simple test for the availability of wan-animate inference with metaquery
workspace: RTX4090
project: wan-animate

max_restarts: 0
resources:
  resource_pool: ada-48g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368

bind_mounts:
  - host_path: /mount/HOME/liuzhirui
    container_path: /home/liuzhirui
  - host_path: /mount/NAS1/public
    container_path: /run/determined/NAS1/public

environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
    - HOME=/home/liuzhirui

checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: model/checkpoint
  save_experiment_best: 0
  save_trial_best: 1
  save_trial_latest: 1

searcher:
  name: single
  metric: validation_loss
  max_length:
    epochs: 1
  smaller_is_better: true

profiling:
  enabled: true

entrypoint: /home/liuzhirui/model/Wan2.2/scripts-metaquery-single/inference/wan-ti2v-metaquery-inference-new-determined-single-rms-scale.sh

