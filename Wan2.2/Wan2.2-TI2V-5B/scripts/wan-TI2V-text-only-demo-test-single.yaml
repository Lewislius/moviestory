name: wan-TI2V-text-only-demo-test
description: Wan2.2-TI2V-5B single-GPU selected-text-file-to-video demo
workspace: RTX4090
project: wan-animate

max_restarts: 0
resources:
  resource_pool: amp-48g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368

bind_mounts:
  - host_path: /mount/HOME/liuzhirui
    container_path: /home/liuzhirui
  - host_path: /mount/NAS1/public
    container_path: /run/determined/NAS1/public

environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
    - HOME=/home/liuzhirui

checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: model/checkpoint
  save_experiment_best: 0
  save_trial_best: 1
  save_trial_latest: 1

searcher:
  name: single
  metric: validation_loss
  max_length:
    epochs: 1
  smaller_is_better: true

profiling:
  enabled: true

entrypoint: /home/liuzhirui/model/Wan2.2/Wan2.2-TI2V-5B/scripts/wan-TI2V-text-only-demo-determined-single.sh
